<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Israel Cinematic Glow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh;
            background-color: #020617;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            perspective: 1000px;
        }
        /* --- LEUCHTENDE HINTERGRUND-STREIFEN --- */
        .background-container {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 8vh 0; z-index: 1;
            background: radial-gradient(circle at center, #071e43 0%, #020617 100%);
        }
        .stripe {
            width: 100%; height: 14vh;
            background: linear-gradient(90deg, transparent, #0038a8, #00bfff, #0038a8, transparent);
            background-size: 200% 100%;
            animation: moveGradient 3s linear infinite;
            filter: blur(8px);
            box-shadow: 0 0 50px rgba(0, 191, 255, 0.6), 0 0 100px rgba(0, 56, 168, 0.4);
        }
        @keyframes moveGradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        /* --- SPHÄRISCHE AURA (PULSIERENDER NEBEL) --- */
        .aura {
            position: absolute; width: 650px; height: 650px;
            background: radial-gradient(circle, rgba(0, 191, 255, 0.3) 0%, rgba(0, 56, 168, 0.08) 50%, transparent 70%);
            filter: blur(60px); z-index: 2;
            animation: pulseAura 2.5s ease-in-out infinite alternate;
        }
        @keyframes pulseAura {
            0% { transform: scale(0.85); opacity: 0.6; }
            100% { transform: scale(1.15); opacity: 1; }
        }
        /* --- SPHÄRE FÜR DIE STERNE (FLOAT EFFECT) --- */
        .star-wrapper {
            position: relative; z-index: 3;
            transform-style: preserve-3d;
            animation: floatStructure 5s ease-in-out infinite alternate;
        }
        @keyframes floatStructure {
            0% { transform: translateY(-10px) rotateX(4deg); }
            100% { transform: translateY(10px) rotateX(-4deg); }
        }
        /* Hauptstern vorne */
        .star-svg {
            width: 460px; height: 460px;
            filter: drop-shadow(0 0 25px rgba(0, 210, 255, 0.9))
                    drop-shadow(0 0 50px rgba(0, 56, 168, 0.8))
                    drop-shadow(0 0 120px rgba(0, 56, 168, 0.5));
            animation: spinStar 6s linear infinite;
        }
        @keyframes spinStar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Zweiter Stern hinten (dreht sich entgegengesetzt) */
        .star-bg-overlay {
            position: absolute; top: 0; left: 0;
            width: 460px; height: 460px;
            opacity: 0.35; filter: blur(12px) drop-shadow(0 0 40px #0038a8);
            animation: spinStarReverse 10s linear infinite;
            pointer-events: none;
        }
        @keyframes spinStarReverse {
            0% { transform: rotate(360deg) scale(1.15); }
            100% { transform: rotate(0deg) scale(1.15); }
        }
        /* --- INTRO OVERLAY --- */
        .click-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            background: rgba(2, 6, 23, 0.5); backdrop-filter: blur(25px);
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s; cursor: pointer;
        }
        .click-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .play-card {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 35px 60px; border-radius: 50px; text-align: center;
            box-shadow: 0 0 30px rgba(0, 191, 255, 0.1);
        }
        .play-card h2 { color: #ffffff; font-family: sans-serif; font-size: 1.5rem; letter-spacing: 4px; }
    </style>
</head>
<body>

    <div class="click-overlay" id="overlay" onclick="startExperience()">
        <div class="play-card">
            <h2>HAVA NAGILA STARTEN</h2>
        </div>
    </div>

    <div class="background-container">
        <div class="stripe"></div>
        <div class="stripe"></div>
    </div>
    <div class="aura"></div>

    <div class="star-wrapper">
        <svg class="star-svg" viewBox="0 0 100 100" fill="none" stroke="#00d2ff" stroke-width="3.8">
            <polygon points="50,12 83,70 17,70" />
            <polygon points="50,88 83,30 17,30" />
        </svg>
        <svg class="star-bg-overlay" viewBox="0 0 100 100" fill="none" stroke="#0038a8" stroke-width="5">
            <polygon points="50,12 83,70 17,70" />
            <polygon points="50,88 83,30 17,30" />
        </svg>
    </div>

    <audio id="bg-music" loop>
        <source src="Hava Nagila Original.mp3.mp3" type="audio/mp3">
    </audio>

    <script>
        function startExperience() {
            document.getElementById('overlay').classList.add('hidden');
            const audio = document.getElementById('bg-music');
            audio.play().catch(function(e) { console.log("Audio Error:", e); });
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }
        }
    </script>
</body>
</html>
